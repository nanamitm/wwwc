name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.configuration }} ${{ matrix.platform }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [x86, x64]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: microsoft/setup-msbuild@v2

      # The projects use the VS 2026 toolset (v145). When the runner image does not
      # have it yet, build with the newest installed toolset instead.
      - name: Select the platform toolset
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          # MSVC 14.5x = v145 (VS 2026), 14.3x-14.4x = v143 (VS 2022)
          $msvc = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | ForEach-Object { [version]$_.Name }
          Write-Host "Visual Studio: $vs"
          Write-Host "MSVC: $($msvc -join ', ')"
          $toolset = if ($msvc | Where-Object { $_.Minor -ge 50 }) { 'v145' }
                     elseif ($msvc | Where-Object { $_.Minor -ge 30 }) { 'v143' }
          if (-not $toolset) { throw "no supported MSVC toolset (v143 or later) found" }
          Write-Host "Using $toolset"
          "TOOLSET=$toolset" >> $env:GITHUB_ENV
          if ($toolset -ne 'v145') { "::notice::v145 is not installed on this runner; built with $toolset" }

      - name: Build
        shell: pwsh
        run: >
          msbuild WWWC.sln -m -nologo -warnAsError
          -p:Configuration=${{ matrix.configuration }}
          -p:Platform=${{ matrix.platform }}
          -p:PlatformToolset=${{ env.TOOLSET }}

      - name: Test
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $bin = if ('${{ matrix.platform }}' -eq 'x64') { 'x64\Release' } else { 'Release' }
          ./tests/run-tests.ps1 -BinDir $bin

      - name: Upload binaries
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: wwwc-${{ matrix.platform }}
          path: |
            ${{ matrix.platform == 'x64' && 'x64/Release' || 'Release' }}/WWWC.exe
            ${{ matrix.platform == 'x64' && 'x64/Release' || 'Release' }}/wwwc.dll
          retention-days: 14

  # On a version tag (v1.2.0 etc.): package the tested Release builds and create
  # a draft GitHub release. Publishing the draft is done by hand.
  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Check that the tag matches version.h
        shell: pwsh
        run: |
          $v = (Select-String version.h -Pattern '#define\s+WWWC_VERSION_STR\s+"([^"]+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne '${{ github.ref_name }}') { throw "tag ${{ github.ref_name }} does not match version.h ($v)" }
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Package
        shell: pwsh
        run: |
          ./tools/make-package.ps1 -Platform x86 -BinDir artifacts/wwwc-x86 -OutDir dist
          ./tools/make-package.ps1 -Platform x64 -BinDir artifacts/wwwc-x64 -OutDir dist

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $lines = Get-Content CHANGELOG.md
          $start = [array]::IndexOf($lines, "## $env:VERSION")
          if ($start -lt 0) { throw "CHANGELOG.md has no section for $env:VERSION" }
          $end = $start + 1
          while ($end -lt $lines.Count -and $lines[$end] -notmatch '^## ') { $end++ }
          $lines[($start + 1)..($end - 1)] | Set-Content release-notes.md -Encoding utf8

      - name: Create the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' (Get-ChildItem dist/*.zip).FullName `
            --draft --verify-tag --title "WWWC $env:VERSION" --notes-file release-notes.md

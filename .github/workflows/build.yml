name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # a new push to a pull request replaces its older run; runs for main and tags
  # all finish, so every merge commit and release keeps its result
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.configuration }} ${{ matrix.platform }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
        platform: [x86, x64]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: microsoft/setup-msbuild@v3

      # The projects use the VS 2026 toolset (v145). When the runner image does not
      # have it yet, build with the newest installed toolset instead.
      - name: Select the platform toolset
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          # MSVC 14.5x = v145 (VS 2026), 14.3x-14.4x = v143 (VS 2022)
          $msvc = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | ForEach-Object { [version]$_.Name }
          Write-Host "Visual Studio: $vs"
          Write-Host "MSVC: $($msvc -join ', ')"
          $toolset = if ($msvc | Where-Object { $_.Minor -ge 50 }) { 'v145' }
                     elseif ($msvc | Where-Object { $_.Minor -ge 30 }) { 'v143' }
          if (-not $toolset) { throw "no supported MSVC toolset (v143 or later) found" }
          Write-Host "Using $toolset"
          "TOOLSET=$toolset" >> $env:GITHUB_ENV
          if ($toolset -ne 'v145') { "::notice::v145 is not installed on this runner; built with $toolset" }

      - name: Build
        shell: pwsh
        run: >
          msbuild WWWC.sln -m -nologo -warnAsError
          -p:Configuration=${{ matrix.configuration }}
          -p:Platform=${{ matrix.platform }}
          -p:PlatformToolset=${{ env.TOOLSET }}

      - name: Test data-directory selection
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $platform = if ('${{ matrix.platform }}' -eq 'x86') { 'Win32' } else { 'x64' }
          msbuild tests/data_directory_test.vcxproj -nologo -warnAsError -p:Configuration=Release "-p:Platform=$platform" -p:PlatformToolset=${{ env.TOOLSET }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "./native-tests/$platform/data_directory_test.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test
        if: matrix.configuration == 'Release'
        shell: pwsh
        env:
          WWWC_TEST_ROOT: ${{ runner.temp }}/wwwc-tests
        run: |
          $bin = if ('${{ matrix.platform }}' -eq 'x64') { 'x64\Release' } else { 'Release' }
          ./tests/run-tests.ps1 -BinDir $bin

      # the failures, the test server's log and each test's data folder (the
      # copied binaries are left out)
      - name: Upload test logs
        if: failure() && matrix.configuration == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/wwwc-tests/last-results.txt
            ${{ runner.temp }}/wwwc-tests/server.*
            ${{ runner.temp }}/wwwc-tests/*/data/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload binaries
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: wwwc-${{ matrix.platform }}
          path: |
            ${{ matrix.platform == 'x64' && 'x64/Release' || 'Release' }}/WWWC.exe
            ${{ matrix.platform == 'x64' && 'x64/Release' || 'Release' }}/wwwc.dll
          retention-days: 14

      - name: Validate upstream installer packaging
        if: matrix.configuration == 'Release' && matrix.platform == 'x86'
        shell: pwsh
        run: ./Installer/build.ps1 -SkipBuild -Platform x86 -PlatformToolset $env:TOOLSET -OutDir "$env:RUNNER_TEMP/wwwc-installer"

  # AddressSanitizer build (x64) running the same tests: a memory error in
  # WWWC or wwwc.dll fails the test where it happens.
  asan:
    name: AddressSanitizer x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: microsoft/setup-msbuild@v3

      - name: Build with AddressSanitizer
        shell: pwsh
        run: |
          msbuild WWWC.sln -m -nologo -warnAsError -p:Configuration=Release -p:Platform=x64 `
            -p:EnableASAN=true "-p:OutDir=$PWD/asan-build/x64/" "-p:IntDir=asan-build/x64/"
          # the ASan runtime DLL goes next to WWWC.exe
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dll = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\clang_rt.asan_dynamic-x86_64.dll" |
            Sort-Object FullName | Select-Object -Last 1
          Copy-Item $dll.FullName asan-build\x64\

      - name: Test
        shell: pwsh
        # the runner context cannot be used in a job's env, only in steps
        env:
          WWWC_TEST_ROOT: ${{ runner.temp }}/wwwc-tests
        run: ./tests/run-tests.ps1 -BinDir asan-build\x64

      - name: Upload AddressSanitizer reports and test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: asan-reports
          path: |
            ${{ runner.temp }}/wwwc-tests/asan/
            ${{ runner.temp }}/wwwc-tests/last-results.txt
            ${{ runner.temp }}/wwwc-tests/server.*
            ${{ runner.temp }}/wwwc-tests/*/data/
          if-no-files-found: ignore
          retention-days: 14

  # On a version tag (v1.2.0 etc.): package the tested Release builds and create
  # a draft GitHub release. Publishing the draft is done by hand.
  release:
    name: Draft release
    needs: [build, asan]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Check that the tag matches version.h
        shell: pwsh
        run: |
          $v = (Select-String version.h -Pattern '#define\s+WWWC_VERSION_STR\s+"([^"]+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne '${{ github.ref_name }}') { throw "tag ${{ github.ref_name }} does not match version.h ($v)" }
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Package
        shell: pwsh
        run: |
          ./tools/make-package.ps1 -Platform x86 -BinDir artifacts/wwwc-x86 -OutDir dist
          ./tools/make-package.ps1 -Platform x64 -BinDir artifacts/wwwc-x64 -OutDir dist

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $lines = Get-Content CHANGELOG.md
          $start = [array]::IndexOf($lines, "## $env:VERSION")
          if ($start -lt 0) { throw "CHANGELOG.md has no section for $env:VERSION" }
          $end = $start + 1
          while ($end -lt $lines.Count -and $lines[$end] -notmatch '^## ') { $end++ }
          # lines between this heading and the next one, without blank lines at either end
          # (a range a..b with b < a counts down, which would take in the heading itself)
          # (assigned directly: a one-line array returned from an if block would become a string)
          $notes = @()
          if ($end -gt $start + 1) { $notes = @($lines[($start + 1)..($end - 1)]) }
          $first = 0; $last = $notes.Count - 1
          while ($first -le $last -and $notes[$first].Trim() -eq '') { $first++ }
          while ($last -ge $first -and $notes[$last].Trim() -eq '') { $last-- }
          if ($first -gt $last) { throw "the section for $env:VERSION in CHANGELOG.md is empty" }
          $notes[$first..$last] | Set-Content release-notes.md -Encoding utf8

      - name: Create the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' (Get-ChildItem dist/*.zip).FullName `
            --draft --verify-tag --title "WWWC $env:VERSION" --notes-file release-notes.md
